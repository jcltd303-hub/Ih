name: Apply Spine asset bundles

on:
  push:
    branches: [main]
    paths:
      - "spine-rig (2).zip"
      - "spine-rig (3).zip"
      - ".github/workflows/apply-tetra-spine.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract authored Spine exports
        shell: bash
        run: |
          set -euo pipefail

          apply_bundle() {
            zip="$1"
            dest="$2"
            rm -rf "$dest"
            mkdir -p "$dest"
            unzip -o "$zip" -d "$dest"
            json="$(find "$dest" -type f -name '*.json' | head -1)"
            atlas="$(find "$dest" -type f -name '*.atlas' | head -1)"
            test -n "$json"
            test -n "$atlas"
            if [ "$json" != "$dest/rig.json" ]; then cp "$json" "$dest/rig.json"; fi
            if [ "$atlas" != "$dest/rig.atlas" ]; then cp "$atlas" "$dest/rig.atlas"; fi
            echo "$zip -> $dest"
            find "$dest" -maxdepth 3 -type f -print
          }

          apply_bundle "spine-rig (2).zip" public/spine/tetra
          apply_bundle "spine-rig (3).zip" public/spine/boss

      - name: Refresh dependency lock
        run: npm install --package-lock-only
      - name: Commit generated runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/spine/tetra public/spine/boss package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: apply Spine exports"
          git push
